name: 'Register new ECS task definition revision'
description: >
  Fetches the current revision of an ECS task definition, strips read-only fields,
  optionally updates a container image URI and environment variables, and registers
  a new revision.
  Outputs the new task definition ARN.

inputs:
  task-definition-family:
    description: 'ECS task definition family name'
    required: true
  image-uri:
    description: 'Container image URI to set. If omitted, the existing image is kept.'
    required: false
    default: ''
  container-name:
    description: 'Name of the container to update. Required when environment-variables is set, or when image-uri is set and the task has multiple containers.'
    required: false
    default: ''
  environment-variables:
    description: 'JSON object of environment variable names and values to set on the selected container.'
    required: false
    default: '{}'

outputs:
  task-definition-arn:
    description: 'ARN of the newly registered task definition revision'
    value: ${{ steps.register.outputs.task-definition-arn }}

runs:
  using: composite
  steps:
    - name: Fetch, clean, and register task definition
      id: register
      shell: bash
      env:
        FAMILY: ${{ inputs.task-definition-family }}
        IMAGE_URI: ${{ inputs.image-uri }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        ENVIRONMENT_VARIABLES: ${{ inputs.environment-variables }}
      run: |
        TASK_DEF_FILE="task-def-${FAMILY}.json"

        aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition \
          | jq 'del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy, .compatibilities, .requiresAttributes)' \
          > "$TASK_DEF_FILE"

        if [ -n "$IMAGE_URI" ]; then
          if [ -n "$CONTAINER_NAME" ]; then
            jq --arg image "$IMAGE_URI" --arg name "$CONTAINER_NAME" \
              '(.containerDefinitions[] | select(.name == $name) | .image) = $image' \
              "$TASK_DEF_FILE" > "${TASK_DEF_FILE}.tmp"
          else
            jq --arg image "$IMAGE_URI" '.containerDefinitions[].image = $image' \
              "$TASK_DEF_FILE" > "${TASK_DEF_FILE}.tmp"
          fi
          mv "${TASK_DEF_FILE}.tmp" "$TASK_DEF_FILE"
        fi

        if [ "$ENVIRONMENT_VARIABLES" != "{}" ]; then
          if [ -z "$CONTAINER_NAME" ]; then
            echo "container-name is required when environment-variables is set" >&2
            exit 1
          fi

          if ! jq -e '
            type == "object" and
            all(.[]; type == "string" or type == "number" or type == "boolean")
          ' <<< "$ENVIRONMENT_VARIABLES" >/dev/null; then
            echo "environment-variables must be a JSON object with scalar values" >&2
            exit 1
          fi

          if ! jq -e --arg name "$CONTAINER_NAME" \
            'any(.containerDefinitions[]; .name == $name)' \
            "$TASK_DEF_FILE" >/dev/null; then
            echo "container $CONTAINER_NAME was not found in task definition $FAMILY" >&2
            exit 1
          fi

          jq --argjson variables "$ENVIRONMENT_VARIABLES" --arg name "$CONTAINER_NAME" '
            (.containerDefinitions[] | select(.name == $name) | .environment) |=
              (
                (
                  . // []
                  | map(
                      .name as $key
                      | select(($variables | has($key)) | not)
                    )
                )
                + (
                  $variables
                  | to_entries
                  | map({
                      name: .key,
                      value: (.value | tostring)
                    })
                )
              )
          ' "$TASK_DEF_FILE" > "${TASK_DEF_FILE}.tmp"
          mv "${TASK_DEF_FILE}.tmp" "$TASK_DEF_FILE"
        fi

        ARN=$(aws ecs register-task-definition --cli-input-json "file://$TASK_DEF_FILE" \
          --query taskDefinition.taskDefinitionArn --output text)
        echo "task-definition-arn=$ARN" >> "$GITHUB_OUTPUT"
