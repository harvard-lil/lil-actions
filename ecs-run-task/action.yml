name: 'Run an ECS task and wait for it'

description: >
  Starts one task from a task definition, waits for it to stop, prints what
  its container logged, and fails unless the container exited 0. For
  deploy-time work that should run exactly once from the image being
  deployed, such as Django migrations, rather than inside a task that is
  serving traffic or about to be replaced.

  The task borrows its network configuration from a service in the same
  cluster, so callers need not carry subnet and security-group ids. The
  deploy role needs ecs:RunTask, iam:PassRole on the task definition's roles,
  ecs:DescribeTasks, and logs:GetLogEvents on the container's log group.
  AWS credentials must be configured before this action runs.

inputs:
  cluster:
    description: 'ECS cluster name'
    required: true
  task-definition:
    description: 'Task definition to run: an ARN with revision, or a family for its latest ACTIVE revision'
    required: true
  network-from-service:
    description: 'Service in the cluster whose networkConfiguration the task copies'
    required: true
  container:
    description: >
      Container whose exit status is the result. May be omitted when the task
      definition has exactly one container.
    required: false
    default: ''
  launch-type:
    description: 'Passed to run-task as --launch-type'
    required: false
    default: 'FARGATE'
  timeout-seconds:
    description: >
      How long to wait for the task to stop. On timeout the task is left
      running -- stopping a migration partway is not safer than letting it
      finish -- and this step fails naming the task ARN.
    required: false
    default: '1800'
  poll-interval-seconds:
    description: 'Seconds between describe-tasks polls'
    required: false
    default: '15'
  started-by:
    description: 'Value for the task''s startedBy field'
    required: false
    default: 'lil-actions/ecs-run-task'

outputs:
  task-arn:
    description: 'ARN of the task that ran'
    value: ${{ steps.run.outputs.task-arn }}
  exit-code:
    description: 'Exit status of the named container, empty if it never reported one'
    value: ${{ steps.wait.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Start the task
      id: run
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
        TASK_DEFINITION: ${{ inputs.task-definition }}
        NETWORK_FROM_SERVICE: ${{ inputs.network-from-service }}
        CONTAINER: ${{ inputs.container }}
        LAUNCH_TYPE: ${{ inputs.launch-type }}
        STARTED_BY: ${{ inputs.started-by }}
      run: |
        set -euo pipefail

        network="$(aws ecs describe-services --cluster "$CLUSTER" --services "$NETWORK_FROM_SERVICE" \
          --query 'services[0].networkConfiguration' --output json)"
        if [ -z "$network" ] || [ "$network" = "null" ]; then
          echo "::error::Service '${NETWORK_FROM_SERVICE}' in '${CLUSTER}' has no network configuration to copy."
          exit 1
        fi

        definition="$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" \
          --query taskDefinition --output json)"
        definition_arn="$(jq -r '.taskDefinitionArn' <<< "$definition")"

        if [ -z "$CONTAINER" ]; then
          count="$(jq '.containerDefinitions | length' <<< "$definition")"
          if [ "$count" -ne 1 ]; then
            echo "::error::${definition_arn} has ${count} containers; name the one whose exit status counts."
            exit 1
          fi
          CONTAINER="$(jq -r '.containerDefinitions[0].name' <<< "$definition")"
        elif ! jq -e --arg c "$CONTAINER" 'any(.containerDefinitions[]; .name == $c)' <<< "$definition" >/dev/null; then
          echo "::error::${definition_arn} has no container named '${CONTAINER}'."
          exit 1
        fi

        # Where the container's output will be, read now so the wait step can
        # print it without asking again.
        log_group="$(jq -r --arg c "$CONTAINER" \
          '.containerDefinitions[] | select(.name == $c) | .logConfiguration | select(.logDriver == "awslogs") | .options["awslogs-group"] // empty' \
          <<< "$definition")"
        log_prefix="$(jq -r --arg c "$CONTAINER" \
          '.containerDefinitions[] | select(.name == $c) | .logConfiguration | select(.logDriver == "awslogs") | .options["awslogs-stream-prefix"] // empty' \
          <<< "$definition")"

        started="$(aws ecs run-task --cluster "$CLUSTER" \
          --task-definition "$definition_arn" \
          --launch-type "$LAUNCH_TYPE" \
          --network-configuration "$network" \
          --started-by "$STARTED_BY" \
          --count 1 --output json)"

        # run-task reports a task it could not place in `failures` and exits 0.
        if [ "$(jq '.failures | length' <<< "$started")" -ne 0 ]; then
          echo "::error::ECS did not start a task from ${definition_arn}:"
          jq -r '.failures[] | "::error::\(.reason)\(if .detail then ": " + .detail else "" end)"' <<< "$started"
          exit 1
        fi
        task_arn="$(jq -r '.tasks[0].taskArn // empty' <<< "$started")"
        if [ -z "$task_arn" ]; then
          echo "::error::run-task returned neither a task nor a failure."
          exit 1
        fi
        echo "Started ${task_arn##*/} from ${definition_arn##*/}"

        {
          echo "task-arn=$task_arn"
          echo "container=$CONTAINER"
          echo "log-group=$log_group"
          echo "log-prefix=$log_prefix"
        } >> "$GITHUB_OUTPUT"

    - name: Wait for the task to stop
      id: wait
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
        TASK_ARN: ${{ steps.run.outputs.task-arn }}
        CONTAINER: ${{ steps.run.outputs.container }}
        LOG_GROUP: ${{ steps.run.outputs.log-group }}
        LOG_PREFIX: ${{ steps.run.outputs.log-prefix }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
        POLL: ${{ inputs.poll-interval-seconds }}
      run: |
        set -euo pipefail
        task_id="${TASK_ARN##*/}"
        deadline=$(( $(date +%s) + TIMEOUT ))

        while :; do
          task="$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0]' --output json)"
          if [ -z "$task" ] || [ "$task" = "null" ]; then
            echo "::error::describe-tasks no longer returns ${task_id}."
            exit 1
          fi
          status="$(jq -r '.lastStatus' <<< "$task")"
          echo "$(date -u +%H:%M:%S) ${task_id}: ${status}"
          if [ "$status" = "STOPPED" ]; then
            break
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "exit-code=" >> "$GITHUB_OUTPUT"
            echo "::error::${task_id} is still ${status} after ${TIMEOUT}s. It has not been stopped;"
            echo "::error::watch it with: aws ecs describe-tasks --cluster ${CLUSTER} --tasks ${TASK_ARN}"
            exit 1
          fi
          sleep "$POLL"
        done

        # What the container said, for the log that a failed migration leaves
        # behind. Diagnostic: a log that cannot be read is reported and the
        # exit status below still decides the outcome.
        if [ -n "$LOG_GROUP" ] && [ -n "$LOG_PREFIX" ]; then
          stream="${LOG_PREFIX}/${CONTAINER}/${task_id}"
          echo "::group::${LOG_GROUP} ${stream}"
          if ! aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$stream" \
                --start-from-head --query 'events[].message' --output json | jq -r '.[]'; then
            echo "::warning::Could not read ${stream} from ${LOG_GROUP}."
          fi
          echo "::endgroup::"
        else
          echo "::warning::Container '${CONTAINER}' does not log to CloudWatch; nothing to show."
        fi

        stop_code="$(jq -r '.stopCode // "unknown"' <<< "$task")"
        stopped_reason="$(jq -r '.stoppedReason // ""' <<< "$task")"
        exit_code="$(jq -r --arg c "$CONTAINER" \
          '.containers[] | select(.name == $c) | .exitCode // empty' <<< "$task")"
        container_reason="$(jq -r --arg c "$CONTAINER" \
          '.containers[] | select(.name == $c) | .reason // empty' <<< "$task")"
        echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"

        echo "Stopped: ${stop_code}${stopped_reason:+ -- ${stopped_reason}}"
        if [ -z "$exit_code" ]; then
          echo "::error::Container '${CONTAINER}' in ${task_id} reported no exit status${container_reason:+: ${container_reason}}."
          exit 1
        fi
        if [ "$exit_code" != "0" ]; then
          echo "::error::Container '${CONTAINER}' in ${task_id} exited ${exit_code}${container_reason:+: ${container_reason}}."
          exit 1
        fi
        echo "Container '${CONTAINER}' exited 0."
