name: 'Wait for ECS deployment'

description: >
  Waits for an ECS service deployment to finish successfully.
  AWS credentials must be configured before this action runs.

inputs:
  task-definition:
    description: 'Expected full task definition ARN. If omitted, capture the service selection when waiting starts.'
    required: false
    default: ''

  cluster:
    description: 'ECS cluster name'
    required: true

  service:
    description: 'ECS service name'
    required: true

  timeout-seconds:
    description: 'Maximum time to wait for the ECS deployment to complete'
    required: false
    default: '900'

  poll-interval-seconds:
    description: 'Seconds to wait between ECS deployment status checks'
    required: false
    default: '60'

runs:
  using: composite
  steps:
    - name: Wait for ECS deployment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXPECTED_TASK_DEFINITION: ${{ inputs.task-definition }}
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: ${{ inputs.service }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
      run: bash "$ACTION_PATH/../scripts/ecs_wait_for_deployment.sh"
