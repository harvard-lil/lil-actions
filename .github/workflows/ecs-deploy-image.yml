name: ECS deploy image

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment supplying the deployment boundary and secrets'
        required: false
        type: string
        default: ''
      aws-region:
        description: 'AWS region'
        required: false
        type: string
        default: us-east-1
      ecr-repository:
        description: 'ECR repository containing the image digest'
        required: true
        type: string
      image-digest:
        description: 'Image digest to deploy, including the sha256: prefix'
        required: true
        type: string
      task-definition-family:
        description: 'ECS task definition family to copy and update'
        required: true
        type: string
      container-name:
        description: 'Container in the task definition whose image should be replaced'
        required: true
        type: string
      cluster:
        description: 'ECS cluster name'
        required: true
        type: string
      service:
        description: 'ECS service name'
        required: true
        type: string
      terraform-tag:
        description: >
          Optional explicitly mutable tag used by Terraform's placeholder task
          definition. When set, it is moved to image-digest before deployment.
        required: false
        type: string
        default: ''
      retention-tag:
        description: 'Optional immutable tag marking this digest as deployed'
        required: false
        type: string
        default: ''
      timeout-seconds:
        description: 'Maximum time to wait for the ECS deployment to become stable'
        required: false
        type: string
        default: '900'
    secrets:
      aws-role-arn:
        description: 'IAM role ARN to assume via OIDC'
        required: true
    outputs:
      task-definition-arn:
        description: 'Digest-pinned task definition used by the updated service'
        value: ${{ jobs.deploy.outputs.task-definition-arn }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    outputs:
      task-definition-arn: ${{ steps.task-definition.outputs.task-definition-arn }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate image digest
        env:
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image-digest is not a sha256 digest: $IMAGE_DIGEST"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to AWS ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Mark image for retention
        if: inputs.retention-tag != ''
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: ${{ inputs.ecr-repository }}
          source: ${{ inputs.image-digest }}
          tag: ${{ inputs.retention-tag }}

      - name: Keep Terraform's image tag aligned
        if: inputs.terraform-tag != ''
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: ${{ inputs.ecr-repository }}
          source: ${{ inputs.image-digest }}
          tag: ${{ inputs.terraform-tag }}
          replace-existing: 'true'

      - name: Register digest-pinned task definition
        id: task-definition
        uses: harvard-lil/lil-actions/ecs-register-task-def@main
        with:
          task-definition-family: ${{ inputs.task-definition-family }}
          container-name: ${{ inputs.container-name }}
          image-uri: ${{ steps.ecr.outputs.registry }}/${{ inputs.ecr-repository }}@${{ inputs.image-digest }}

      - name: Deploy task definition
        uses: harvard-lil/lil-actions/ecs-deploy@main
        with:
          cluster: ${{ inputs.cluster }}
          service: ${{ inputs.service }}
          task-definition: ${{ steps.task-definition.outputs.task-definition-arn }}

      - name: Wait for healthy deployment
        uses: harvard-lil/lil-actions/ecs-wait-for-deployment@main
        with:
          cluster: ${{ inputs.cluster }}
          service: ${{ inputs.service }}
          timeout-seconds: ${{ inputs.timeout-seconds }}

      - name: Verify the requested revision completed
        env:
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: ${{ inputs.service }}
          EXPECTED_TASK_DEFINITION: ${{ steps.task-definition.outputs.task-definition-arn }}
        run: |
          set -euo pipefail
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" |
            jq -e --arg expected "$EXPECTED_TASK_DEFINITION" '
              (.failures | length) == 0 and
              (.services | length) == 1 and
              (.services[0] |
                .taskDefinition == $expected and
                any(.deployments[];
                  .status == "PRIMARY" and
                  .taskDefinition == $expected and
                  .rolloutState == "COMPLETED"))
            ' >/dev/null
