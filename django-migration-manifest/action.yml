name: Inspect Django image migrations
description: Generate a format-1 migration manifest from an image using shared inspection code, without network or database access.
inputs:
  image:
    required: true
    description: Built local image or immutable registry image
  output:
    default: migrations.json
    description: Output manifest file
  settings-module:
    default: ''
    description: Django settings module; defaults to the image's configuration
  working-directory:
    default: ''
    description: Application directory; defaults to the image's working directory
  environment:
    default: '{}'
    description: JSON object of placeholder environment values required to load settings; do not supply production credentials
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        IMAGE: ${{ inputs.image }}
        MANIFEST: ${{ inputs.output }}
        SETTINGS_MODULE: ${{ inputs.settings-module }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        IMAGE_ENVIRONMENT: ${{ inputs.environment }}
      run: python3 "$ACTION_PATH/../scripts/image_migration_manifest.py"
