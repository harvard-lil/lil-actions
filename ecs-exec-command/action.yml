name: 'Run ECS exec command'

description: >
  Runs a command inside a running ECS service task using ECS Exec.
  Verifies the remote command exit status before reporting success.
  AWS credentials must be configured before this action runs.

inputs:
  cluster:
    description: 'ECS cluster name'
    required: true

  service:
    description: 'ECS service name'
    required: true

  container:
    description: 'ECS container name'
    required: true

  command:
    description: 'Command to run inside the ECS container'
    required: true

runs:
  using: composite
  steps:
    - name: Run ECS exec command
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: ${{ inputs.service }}
        CONTAINER: ${{ inputs.container }}
        COMMAND: ${{ inputs.command }}
      run: python3 "$ACTION_PATH/../scripts/ecs_django.py" exec
